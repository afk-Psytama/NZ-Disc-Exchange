<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZ Disc Golf Exchange</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">🥏 NZ Disc Golf Exchange</h1>
      <div id="auth-buttons" class="flex gap-2">
        <button onclick="openAuthModal('signin')" class="px-4 py-2 text-sm bg-slate-700 hover:bg-slate-600 rounded-lg">Sign In</button>
        <button onclick="openAuthModal('signup')" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold">Sign Up</button>
      </div>
      <div id="user-menu" class="hidden flex items-center gap-3">
        <span id="user-email-display" class="text-xs text-slate-400"></span>
        <button onclick="openAccountModal()" class="px-3 py-1.5 text-sm bg-slate-700 hover:bg-slate-600 rounded-lg">Account</button>
        <button onclick="handleSignOut()" class="px-3 py-1.5 text-sm bg-red-600/80 hover:bg-red-500 rounded-lg">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Header / Actions -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Active Listings</h2>
      <button onclick="openNewListingModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold">
        + Create Listing
      </button>
    </div>

    <!-- Listings Grid -->
    <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-400 col-span-full">Loading listings...</p>
    </div>
  </main>

  <!-- Auth Modal (Sign In / Sign Up) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl w-full max-w-md relative">
      <button onclick="closeModal('auth-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
      
      <!-- Tabs -->
      <div class="flex border-b border-slate-700 mb-6">
        <button id="tab-signin" onclick="switchAuthTab('signin')" class="flex-1 pb-3 text-center border-b-2 font-semibold">Sign In</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 pb-3 text-center border-b-2 font-semibold text-slate-400 border-transparent">Sign Up</button>
      </div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
            <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500" placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
            <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500" placeholder="••••••••">
          </div>
          <div id="signup-extra-fields" class="hidden space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
              <input type="text" id="auth-fullname" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500" placeholder="Jane Doe">
            </div>
          </div>
          <p id="auth-error" class="text-xs text-red-400 hidden"></p>
          <p id="auth-success" class="text-xs text-emerald-400 hidden"></p>
          <button type="submit" id="auth-submit-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm transition">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Account Modal -->
  <div id="account-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl w-full max-w-lg relative">
      <button onclick="closeModal('account-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
      <h3 class="text-xl font-bold mb-4">Your Account Details</h3>
      <form onsubmit="handleSaveProfile(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
          <input type="text" id="acc-fullname" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">City / Region</label>
          <input type="text" id="acc-location" placeholder="e.g. Lower Hutt, Wellington" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Delivery Address <span class="text-slate-500">(Optional - for sellers to ship discs)</span></label>
          <textarea id="acc-delivery" rows="2" placeholder="123 Street Name, Suburb, City" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Bank Account Number <span class="text-slate-500">(Optional - for buyers to send payments)</span></label>
          <input type="text" id="acc-bank" placeholder="12-3456-7890123-00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <p id="acc-status" class="text-xs hidden"></p>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm">Save Details</button>
      </form>
    </div>
  </div>

  <script>
    // Config: Replace with your actual Supabase credentials
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeAuthTab = 'signin';
    let currentUser = null;

    // Check current session on load
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      setUser(session?.user || null);
      fetchListings();

      supabase.auth.onAuthStateChange((_event, session) => {
        setUser(session?.user || null);
      });
    }

    function setUser(user) {
      currentUser = user;
      const authBtns = document.getElementById('auth-buttons');
      const userMenu = document.getElementById('user-menu');
      if (user) {
        authBtns.classList.add('hidden');
        userMenu.classList.remove('hidden');
        document.getElementById('user-email-display').innerText = user.email;
      } else {
        authBtns.classList.remove('hidden');
        userMenu.classList.add('hidden');
      }
    }

    // Auth Tab switching
    function switchAuthTab(tab) {
      activeAuthTab = tab;
      const signinBtn = document.getElementById('tab-signin');
      const signupBtn = document.getElementById('tab-signup');
      const extraFields = document.getElementById('signup-extra-fields');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (tab === 'signin') {
        signinBtn.className = "flex-1 pb-3 text-center border-b-2 font-semibold text-emerald-400 border-emerald-400";
        signupBtn.className = "flex-1 pb-3 text-center border-b-2 font-semibold text-slate-400 border-transparent";
        extraFields.classList.add('hidden');
        submitBtn.innerText = "Sign In";
      } else {
        signupBtn.className = "flex-1 pb-3 text-center border-b-2 font-semibold text-emerald-400 border-emerald-400";
        signinBtn.className = "flex-1 pb-3 text-center border-b-2 font-semibold text-slate-400 border-transparent";
        extraFields.classList.remove('hidden');
        submitBtn.innerText = "Sign Up & Send Confirmation";
      }
    }

    function openAuthModal(tab = 'signin') {
      switchAuthTab(tab);
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      const succEl = document.getElementById('auth-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      if (activeAuthTab === 'signup') {
        const fullName = document.getElementById('auth-fullname').value;
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } }
        });

        if (error) {
          errEl.innerText = error.message;
          errEl.classList.remove('hidden');
        } else {
          succEl.innerText = "Confirmation link sent to " + email + ". Please check your inbox and confirm to finish signing up!";
          succEl.classList.remove('hidden');
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          errEl.innerText = error.message;
          errEl.classList.remove('hidden');
        } else {
          closeModal('auth-modal');
        }
      }
    }

    async function handleSignOut() {
      await supabase.auth.signOut();
    }

    // Account Modal logic
    async function openAccountModal() {
      if (!currentUser) return;
      document.getElementById('account-modal').classList.remove('hidden');

      // Fetch existing profile
      const { data } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (data) {
        document.getElementById('acc-fullname').value = data.full_name || '';
        document.getElementById('acc-location').value = data.location || '';
        document.getElementById('acc-delivery').value = data.delivery_address || '';
        document.getElementById('acc-bank').value = data.bank_account || '';
      }
    }

    async function handleSaveProfile(e) {
      e.preventDefault();
      const status = document.getElementById('acc-status');
      
      const payload = {
        id: currentUser.id,
        full_name: document.getElementById('acc-fullname').value,
        location: document.getElementById('acc-location').value,
        delivery_address: document.getElementById('acc-delivery').value,
        bank_account: document.getElementById('acc-bank').value,
        updated_at: new Date()
      };

      const { error } = await supabase.from('profiles').upsert(payload);

      if (error) {
        status.innerText = "Error: " + error.message;
        status.className = "text-xs text-red-400";
      } else {
        status.innerText = "Profile updated successfully!";
        status.className = "text-xs text-emerald-400";
        setTimeout(() => closeModal('account-modal'), 1200);
      }
      status.classList.remove('hidden');
    }

    // Fetch listings placeholder
    async function fetchListings() {
      const grid = document.getElementById('listings-grid');
      const { data, error } = await supabase.from('listings').select('*').order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 col-span-full">No listings available yet.</p>`;
        return;
      }

      grid.innerHTML = data.map(item => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-lg">${item.title}</h3>
            <p class="text-xs text-slate-400 mb-2">${item.brand || ''} • ${item.weight || ''}g</p>
            <p class="text-sm text-slate-300 mb-4">${item.description || ''}</p>
          </div>
          <div class="flex justify-between items-center border-t border-slate-700 pt-3">
            <span class="text-emerald-400 font-bold">$${item.price || 0}</span>
            <button onclick="checkBidAuth()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded">Place Bid / Contact</button>
          </div>
        </div>
      `).join('');
    }

    function checkBidAuth() {
      if (!currentUser) {
        alert("Please sign in or sign up (and confirm your email) to bid or message sellers.");
        openAuthModal('signin');
      } else {
        alert("You are authenticated! Bidding / messaging enabled.");
      }
    }

    function openNewListingModal() {
      if (!currentUser) {
        alert("Please sign in to create a listing.");
        openAuthModal('signin');
      } else {
        alert("Create listing form modal opens here.");
      }
    }

    init();
  </script>
</body>
</html>
